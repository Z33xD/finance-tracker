spring.application.name=Finance Tracker
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
exchangerate.api.key=${EXCHANGERATE_API_KEY}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JWT Secret Key
security.jwt.secret-key = ${JWT_SECRET_KEY}
security.jwt.expiration-time = 3600000

# Mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.from=${SUPPORT_EMAIL}
spring.mail.properties.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
